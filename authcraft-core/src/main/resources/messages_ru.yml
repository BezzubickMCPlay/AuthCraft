prefix: "§6[AuthCraft] §r"

# ═══ Регистрация ═══
register:
  usage: "§eИспользование: /register <пароль> <пароль>"
  success: "§aРегистрация прошла успешно! Добро пожаловать!"
  already-registered: "§cЭто имя уже зарегистрировано."
  passwords-mismatch: "§cПароли не совпадают."
