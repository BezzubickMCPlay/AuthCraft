  locked: "§cАккаунт заблокирован. Повторите через §e{time}§c."
  kicked-locked: "§cАккаунт заблокирован на {time} из-за множества неудачных попыток входа."
  prompt: "§eДля входа введите: §e/login <пароль>"
  session-restored: "§aСессия восстановлена. С возвращением!"
  already-authenticated: "§cВы уже авторизованы."
  
  # ═══ Выход ═══
  logout:
    success: "§aВы вышли из системы. Используйте §e/login §aдля повторного входа."
    not-authenticated: "§cВы не авторизованы."
    kick: "§cВы вышли из системы.\n§7Ваша сессия завершена.\n§eПереподключитесь для повторного входа."
  
  # ═══ Пароль ═══
password:
  change-usage: "§eИспользование: /changepassword <старый> <новый>"
  changed: "§aПароль успешно изменён! Все сессии сброшены."
  old-incorrect: "§cТекущий пароль неверен."
  weak-header: "§cСлабый пароль:"
  weak-item: "§7- {violation}"
  must-login: "§cВы должны войти в систему."

# ═══ Двухфакторная аутентификация ═══
2fa:
  usage: |
    §e═══ AuthCraft 2FA ═══
    §7/2fa enable [totp|telegram|vk|email] §8— включить
    §7/2fa confirm <код> §8— подтвердить настройку
    §7/2fa disable <пароль> [метод] §8— отключить все или конкретный метод
    §7/2fa status §8— показать включённые методы
    §7/2fa backup §8— обновить резервные коды
    §7/2fa <код> §8— ввести код при входе
  prompt: "§eВведите код 2FA: §e/2fa <код>"
  invalid-code: "§cНеверный код. Осталось попыток: §e{remaining}§c. Вы можете использовать резервный код."
  too-many-attempts: "§cСлишком много неудачных попыток 2FA."
  no-pending: "§cНет ожидающей проверки 2FA."
  method-unavailable: "§cМетод 2FA §e{method} §cнедоступен."
  unknown-method: "§cНеизвестный метод. Используйте: totp, telegram, vk, email"
  setup-header: "§a═══ Настройка 2FA ═══"
  setup-method: "§7Метод: §f{method}"
  setup-secret: "§7Секретный ключ: §f{secret}"
  setup-qr: "§7Отсканируйте QR-код в Google Authenticator"
  setup-qr-clickable: "§7Или нажмите на ссылку выше, чтобы открыть в приложении-аутентификаторе"
  setup-telegram: "§7Отправьте код §f{code} §7боту в Telegram: §f@{bot}"
  setup-vk: "§7Отправьте код §f{code} §7боту ВКонтакте: §f{bot}"
  setup-email: "§7Код отправлен на §f{email}"
  setup-confirm: "§7Затем подтвердите: §e/2fa confirm <код>"
  enabled: "§a✓ Двухфакторная аутентификация включена!"
  disabled: "§aДвухфакторная аутентификация отключена."
  wrong-password: "§cНеверный пароль."
  backup-header: "§a═══ Резервные коды ═══"
  backup-warning-save: "§c⚠ Сохраните эти коды! Они не могут быть показаны повторно."
  backup-code: "§7 {code}"
  backup-footer: "§a═════════════════════"
  backup-remaining: "§e⚠ Осталось резервных кодов: §c{remaining}§e. Используйте §e/2fa backup §eдля обновления."
  confirm-usage: "§eИспользование: /2fa confirm <код>"
  confirm-invalid: "§cНеверный код. Попробуйте ещё раз."
  disable-usage: "§eИспользование: /2fa disable <пароль> [метод]"
  no-setup: "§cНет активной настройки 2FA. Сначала используйте §e/2fa enable"
  status-header: "§a═══ Статус 2FA ═══"
  status-none: "§7Нет включённых методов 2FA."
  status-footer: "§a═════════════════════"
  method-disabled: "§aМетод 2FA §e{method} §aотключён."
  already-enabled: "§cМетод 2FA §e{method} §cуже включён."
  session-restore-blocked: "§cВы не можете включить 2FA после восстановления сессии. Сначала войдите с паролем."
  # Сообщения для Telegram/VK
  login-request-title: "🔐 Запрос на вход в AuthCraft"
  login-request-player: "👤 Игрок: {player}"
  login-request-ip: "🌐 IP: {ip}"
  login-request-location: "📍 Местоположение: {location}"
  login-request-time: "🕐 Время: {time}"
  login-request-confirm: "✅ Подтвердить"
  login-request-deny: "❌ Отклонить"
  login-approved: "§a✓ Вход подтверждён через {method}!"
  login-denied: "§cВход отклонён через {method}. Если это не вы, смените пароль!"
  login-denied-kick: "§cВход отклонён владельцем аккаунта."
  login-waiting: "§eОжидание подтверждения через {method}... Или введите код: /2fa <код>"
  login-timeout: "§cВремя ожидания подтверждения истекло. Попробуйте снова."

