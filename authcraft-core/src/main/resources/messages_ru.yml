  prompt: "§aДля регистрации введите: §e/register <пароль> <пароль>"

# ═══ Авторизация ═══
login:
  usage: "§eИспользование: /login <пароль>"
  success: "§aВы успешно авторизованы!"
  wrong-password: "§cНеверный пароль. Осталось попыток: §e{remaining}"
