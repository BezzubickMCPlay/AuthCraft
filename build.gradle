plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

allprojects {
    group = project.property('group')
    version = project.property('version')



        repositories {
            maven { url = 'https://oss.sonatype.org/content/groups/public/' }
            maven { url = 'https://repo.dmulloy2.net/repository/public/' }
            maven { url = 'https://repo.dmulloy2.net/repository/releases/' }
            maven { url = 'https://repo.dmulloy2.net/repository/snapshots/' }
            maven { url = 'https://repo.md-5.net/content/repositories/releases/' }
            maven { url = 'https://repo.md-5.net/content/repositories/snapshots/' }
            maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
            maven { url = 'http://repo.citizensnpcs.co' ; allowInsecureProtocol = true }
            maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
            maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
            maven { url = 'https://repo.papermc.io/repository/maven-public/' }
            maven { url = 'https://jitpack.io' }
            mavenCentral()
        }

}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
        maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://repo.dmulloy2.net/repository/public/' }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        compileOnly 'org.jetbrains:annotations:24.1.0'
        // Use Lombok edge version for Java 25+ compatibility
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
        testImplementation 'org.mockito:mockito-core:5.8.0'
    }

    test {
        useJUnitPlatform()
    }

    compileJava.options.encoding = 'UTF-8'
}